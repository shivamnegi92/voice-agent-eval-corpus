# Display name, primary-capability group, and what each evaluation or
# meta-evaluation work scores, for ARR Table 2 and the appendix table
# (scripts/build_arr_appendix.py). Every phrase restates the
# analysed PDF or the coding basis in taxonomy_coding.yaml; keys must match the
# evaluation and meta-evaluation set there exactly. evidence gives a verbatim
# excerpt ("..." marks omissions) and the PDF page supporting each phrase.

# block: which side-by-side block of main-text Table 2 holds the group.
groups:
  - {id: timing, label: Timing, block: 1}
  - {id: recovery, label: Recovery after disruption, block: 1}
  - {id: meta, label: Meta-evaluation, block: 1}
  - {id: grounded, label: Grounded outcome, block: 2}
  - {id: multiparty, label: Multiparty conduct, block: 2}
  - {id: component, label: Component quality, block: 2}

works:
  dinh2025tts: {group: timing, name: TTS responsiveness, scored: 'Latency distribution, tail latency, and intelligibility of open TTS systems', evidence: {page: 1, quote: 'Our framework unifies latency distribution, tail latency, and intelligibility'}}
  flexi2025: {group: timing, name: FLEXI, scored: 'Full-duplex interaction in synthesized scenarios, including model interruption in emergencies', evidence: {page: 1, quote: 'explicitly incorporates model interruption in emergency scenarios'}}
  floor2026necessity: {group: timing, name: Floor necessity, scored: 'Speaking when invited versus when a reason to intervene arises', evidence: {page: 1, quote: 'FULL-DUPLEX SPEECH MODELS TAKE THE FLOOR WHEN ASKED, NOT WHEN NEEDED'}}
  french2026fdb: {group: timing, name: French FDB, scored: 'Timing metrics and judged content in Canadian and European French', evidence: {page: 1, quote: 'most timing-based metrics behave similarly across languages, while content-based evaluation degrades under language mismatch'}}
