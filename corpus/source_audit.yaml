- paper_id: lee2026hear
  identifier: arXiv:2608.29120
  pdf_filename: hear-speaker-attributed-reasoning.pdf
  category: conversational_benchmarks
  corpus_role: primary
  title: 'HEAR Who Said What: Unlocking Speaker-Attributed Reasoning via Counterfactual
    Voice Grounding'
  authors:
  - Dongwook Lee
  - Sangkwon Park
  - Eunwoo Song
  - Che Hyun Lee
  - Youngho Cho
  - Junho Kim
  - June Young Yi
  - Heeseung Kim
  - Sungroh Yoon
  abstract: Speech Language Models (SLMs) are increasingly deployed in multi-speaker
    environments, yet their ability to attribute speech to the correct speaker and
    reason over speaker identities remains unclear. Hence, we introduce HEAR, a conceptually
    hierarchical benchmark diagnosing the foundational capabilities of speaker-attributed
    reasoning, comprising 2.4K human-verified samples from 887 diverse multi-party
    audio clips. Evaluating 20 leading SLMs on HEAR reveals they struggle with these
    foundational tasks, often relying on semantic priors rather than actual vocal
    cues. To address this, we present A2R, a 30B model optimized on Counterfactual
    Audio with Speaker-level Hard negatives (CASH), a dataset designed to guide the
    model to prioritize acoustic vocal cues over linguistic signals. A2R achieves
    strong performance on HEAR and exhibits zero-shot generalization to diverse multi-speaker
    downstream tasks, demonstrating that learned speaker attribution unlocks the model's
    latent capacity for speaker-aware reasoning. All resources are available at https://attributetoreason.github.io/AttributeToReason/
  published: '2026-08-29T08:01:20Z'
