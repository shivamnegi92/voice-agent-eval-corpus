  authors:
  - Puneet Mathur
  - Dinesh Manocha
  abstract: 'Full-duplex voice agents must continuously decide when to speak, listen,
    backchannel, interrupt, overlap, and yield the conversational floor. Existing
    benchmarks evaluate these behaviors through explicit turn-management instructions,
    whereas voice agents are often configured through roles or personas from which
    appropriate conversational behavior must be inferred. We introduce DuplexSpeechBench-IFEval
    (DSB-IFEval), a benchmark for evaluating implicit instruction following in real-time
    spoken interaction. DSB-IFEval comprises 1,038 test cases derived from 240 controlled
    conversations spanning eight behaviorally contrastive assistant roles and five
    conditioning protocols: default behavior, explicit behavioral instructions, persona-implied
    behavior, combined persona-rule conditioning, and instruction conflict. We measure
    real-time floor management using the deterministic Instruction Adherence Score
    (IAS) and persona-consistent response content using the LLM-judged Persona Adherence
    Score (PAS). Across eleven real-time speech models, we find that executing an
    explicit floor-management policy does not reliably imply the ability to infer
    the same policy from a persona. Moreover, even frontier models such as GPT-Live-1
    and Gemini-3.8-Live adapt their dialogue language to the assigned persona without
    consistently translating that persona into the appropriate full-duplex floor-management
    behavior. Finally, models that successfully resolve benign instruction conflicts
    often fail when safety-relevant role behavior should override an explicit directive.
    These results show that inferring role-implied behavior, executing it in real
    time, and resolving instruction conflicts remain distinct challenges for full-duplex
    voice agents.'
