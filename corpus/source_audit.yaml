- paper_id: ceccatelli2026speechjbb
  identifier: arXiv:2606.06037
  pdf_filename: speechjbb-safety-code-switched-speech.pdf
  category: agentic_evaluation
  corpus_role: primary
  title: 'SpeechJBB: Probing Safety Alignment and Comprehension in Large Audio Language
    Models under Code-Switched Speech'
  authors:
  - Virginia Ceccatelli
  - Yejin Jeon
  - David Ifeoluwa Adelani
  abstract: 'Large audio language models (LALMs) are increasingly deployed in real-world
    applications, yet their safety alignment is still primarily evaluated on monolingual,
    text-based harmful prompts. This leaves their generalizability under multilingual
    and spoken settings, particularly code-switched speech, largely underexplored.
    To address this gap, we introduce SpeechJBB, an audio jailbreak dataset for benchmarking
    state-of-the-art LALMs across five European languages: English, French, German,
    Italian, and Spanish, as well as code-switched variants combining pairs of these
    languages. The extent of safety weaknesses is further probed by introducing an
    augmented setting where phonologically plausible pseudo-words are inserted around
    safety-critical terms to simulate localized obfuscation. Across models, code-switched
    harmful audio yields substantially high jailbreak success rates (JSR), with non-English
    monolingual and non-English code-switched pairs exhibiting the highest attack
    success. Pseudo-word insertion monotonically reduces refusal as insertion density
    increases, even though models rarely attribute harmful meaning to the inserted
    tokens. Comprehension benchmarks show that these failures are not reducible to
    multilingual misunderstanding, as several models with strong ASR, spoken language
    understanding, and spoken reasoning performance are among the most vulnerable.'
