- paper_id: sharon2026less
  identifier: arXiv:2609.11066
  pdf_filename: speech-aspects-end-of-turn-detection.pdf
  category: turn_taking_vap
  corpus_role: primary
  title: 'Less can be More: What Aspects of Speech Drive End-of-Turn Detection'
  authors:
  - Rini Sharon
  - Manickavela A
  - Kadri Hacioglu
  - Andreas Stolcke
  abstract: In conversational AI, detecting when a speaker has finished talking is
    crucial for natural turn taking. While recent work incorporates semantics, the
    relative contribution of different modalities remains unclear. We present a controlled
    ablation of acoustic, prosodic, and semantic signals for streaming end of turn
    detection using a lightweight trimodal classifier. Under identical training conditions,
    the acoustic prosodic combination achieves the best balance of accuracy and latency,
    achieving utterance F1 of 0.93 with 7.8% false alarms at 400ms median latency.
    Adding text increases premature detections without improving performance. Feature
    space analysis confirms that prosodic features have the strongest class separability,
    while text representations overlap substantially. These findings suggest that
    turn-taking is primarily conveyed through intonation and silence patterns rather
    than semantic completeness, enabling faster and more reliable systems without
    expensive text inference.
