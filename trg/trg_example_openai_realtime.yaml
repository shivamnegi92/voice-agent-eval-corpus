# Worked TRG example, populated from published figures for OpenAI's
# gpt-realtime-1.5 as evaluated (not self-reported) by tau-Voice
# (arXiv:2603.13686), Table 3, Table 6, and Table 8.
#
# Purpose: this and its two sibling files (gemini_live, grok_voice) form a
# same-benchmark baseline comparison. All three systems were tested by the
# same third party, under the same conditions, in the same paper - which is
# a stronger comparison than stitching together three vendors' own reported
# numbers, each measured a different way.
#
# Check it with:
#     python3 scripts/validate_trg.py trg/trg_example_openai_realtime.yaml

system:
  name: "OpenAI gpt-realtime-1.5"
  architecture: "end_to_end"
  version: "as evaluated by tau-Voice, arXiv:2603.13686, released Feb 2026"

timing:
  metric: "Latency = avg(Response Latency, Yield Latency), Realistic condition,
           aggregated across Retail/Airline/Telecom domains"
  value: "0.90s"
  statistic: "mean"
  conditions: "Realistic speech complexity: diverse accents, background noise,
               frame drops, muffling, LLM-driven interruptions and
               backchannels, G.711 mu-law 8kHz telephony channel"
  tail_reported: false

recovery:
  disruption_types:
    - "interruption"
    - "backchannel"
    - "false_pause"
  metric: "Responsiveness (avg of Response Rate and Yield Rate within 2s of
           interruption); Interrupt Rate and Selectivity reported alongside"
  value: "Responsiveness 100%; Interrupt Rate 14% (turns where the agent
          speaks before the user finishes); Selectivity 6% (correctly
          ignoring backchannels/vocal tics/non-directed speech)"
  baseline_undisrupted: "not separately reported for these interaction-quality
                         metrics; tau-Voice reports pass@1 (not
                         responsiveness/interrupt/selectivity) under the Clean
                         condition, so the undisturbed comparison exists only
                         for the G axis, not this one"
  notes: "Best-in-benchmark on latency, responsiveness, and interrupt rate,
          but worst-in-benchmark on selectivity: it responds to nearly every
          backchannel, vocal tic, and non-directed utterance as if it were a
          turn-taking cue. The four numbers together show a real trade-off
          that any single metric would hide."

grounded_outcome:
  verification_method: "task completion scored by comparing the final
                        environment state (e.g. database records) to a gold
                        standard, following the tau-2-bench protocol; reported
                        as pass@1"
  state_source: "tau-Voice benchmark's seeded task environments across
                Retail, Airline, and Telecom domains"
  metric: "pass@1 task completion, Realistic condition, aggregated across all
           three domains"
  value: "35%"
  self_report_excluded: true

multiparty:
  applicable: false
  justification: "tau-Voice evaluates single-user, phone-style customer
                  service calls (retail/airline/telecom); no multiparty
                  condition is tested."
