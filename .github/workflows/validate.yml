name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml

      # Hard guard. PDFs remain excluded irrespective of individual licences; a
      # committed PDF is a licensing problem, not an untidy repo.
      - name: No PDFs may be committed
        run: |
          found=$(git ls-files '*.pdf' | wc -l | tr -d ' ')
          echo "tracked PDFs: $found"
          if [ "$found" -ne 0 ]; then
            echo "::error::PDFs must never be committed to this repository."
            git ls-files '*.pdf'
            exit 1
          fi

      - name: Corpus integrity
        run: |
          python3 - <<'PY'
          import csv, json, sys, yaml

          rows = list(csv.DictReader(open("corpus/voice_agent_corpus.csv")))
          data = json.load(open("corpus/voice_agent_corpus.json"))
          metadata = yaml.safe_load(open("corpus/join_overrides.yaml"))
          expected = metadata["revision"]
          fail = []

          if rows != data:
              fail.append("csv/json records differ")
          if len(rows) != expected["total"]:
              fail.append(f"expected {expected['total']} total sources, found {len(rows)}")

          primary = sum(1 for r in rows if r["corpus_role"] == "primary")
          if primary != expected["primary"]:
              fail.append(f"expected {expected['primary']} primary sources, found {primary}")
          for role in ("positioning", "method"):
              if sum(r["corpus_role"] == role for r in rows) != expected[role]:
                  fail.append(f"incorrect {role} source count")

          ids = [r["paper_id"] for r in rows]
          if set(ids) != set(metadata["records"]):
              fail.append("corpus and explicit source records disagree")
          if len(set(ids)) != len(ids):
              fail.append("duplicate paper_id values")

          hashes = [r["pdf_sha256"] for r in rows]
          if len(set(hashes)) != len(hashes):
              fail.append("duplicate pdf_sha256 values")

          prefixes = ("arXiv:", "doi:", "aclanthology:")
          bad = [r["paper_id"] for r in rows
                 if not r["identifier"].startswith(prefixes)]
          if bad:
              fail.append(f"unresolvable identifiers: {bad}")

          for f in fail:
              print(f"ERROR: {f}")
          print(f"checked {len(rows)} rows, {primary} primary")
          sys.exit(1 if fail else 0)
          PY

      - name: TRG validator behaves correctly
        run: |
          # blank template must be rejected
          if python3 scripts/validate_trg.py trg/trg_report_template.yaml >/dev/null 2>&1; then
            echo "::error::blank template should NOT validate"
            exit 1
          fi
          # every worked example must pass
          for f in trg/trg_example_*.yaml; do
            echo "--- $f ---"
            python3 scripts/validate_trg.py "$f"
          done
          echo "TRG validator OK in both directions"

      - name: Leaderboard regenerates cleanly
        run: |
          python3 scripts/build_leaderboard.py
          git diff --exit-code corpus/leaderboard.md corpus/leaderboard.csv || \
            (echo "::error::corpus/leaderboard.{md,csv} is stale - run scripts/build_leaderboard.py and commit the result" && exit 1)
