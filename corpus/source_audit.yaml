- paper_id: hu2026transcription
  identifier: arXiv:2609.15759
  pdf_filename: streaming-user-transcription-full-duplex.pdf
  category: end_to_end_s2s
  corpus_role: primary
  title: Enabling Streaming User Transcription in Full-Duplex Speech-to-Speech Models
  authors:
  - Ke Hu
  - Nourchene Ferchichi
  - Edresson Casanova
  - Ankita Pasad
  - Elena Rastorgueva
  - Chen Chen
  - Nithin Rao Koluguri
  - Piotr Zelasko
  - Yifan Peng
  - Hainan Xu
  - Zhehuai Chen
  - Boris Ginsburg
  abstract: Full-duplex speech-to-speech (S2S) models enable natural conversational
    AI by allowing simultaneous listening and speaking. However, these models typically
    lack inherent user speech transcription, which is essential for applications such
    as conversation logging, accessibility features, and quality monitoring. In this
    work, we propose an efficient method to add streaming ASR capabilities to an existing
    duplex S2S model by introducing a lightweight ASR head in parallel to the agent
    text head. Our approach requires minimal additional parameters and no significant
    architectural changes to the base S2S model, enabling real-time user transcription
    while preserving full-duplex conversational capabilities including turn-taking
    and barge-in handling. Experimental results demonstrate that our method achieves
    streaming average WER of 10.21% on the HuggingFace Open ASR Leaderboard within
    the duplex S2S framework. Additionally, we show that the same architecture trained
    as a standalone streaming ASR model achieves competitive results (7.73% WER) compared
    to current SOTA models. We will open-source our training and inference code to
    facilitate further research in joint streaming ASR and S2S modeling.
