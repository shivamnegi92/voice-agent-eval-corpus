# Two-axis taxonomy coding for every corpus record (cutoff 2026-10-02).
# Axis A (capability evaluated): component, timing, recovery, grounded, multiparty.
# Axis B (evidence quality), coded for evaluation works only:
#   conditions: non_english, real_speech, acoustic_variation, long_session
#   instruments: human_reference, model_judge, state_verification, simulation
# Attributes are marked only when the analysed PDF states them; absence means
# "not reported", not "absent". Roles: evaluation, meta_evaluation, system,
# data, analysis, positioning, method.

vocabulary:
  axes: [component, timing, recovery, grounded, multiparty]
  conditions: [non_english, real_speech, acoustic_variation, long_session]
  instruments: [human_reference, model_judge, state_verification, simulation]

