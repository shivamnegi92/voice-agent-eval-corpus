- paper_id: hu2025vcb
  identifier: arXiv:2510.11098
  pdf_filename: vcb-bench-audio-grounded-conversational-agents.pdf
  category: conversational_benchmarks
  corpus_role: primary
  title: 'VCB Bench: An Evaluation Benchmark for Audio-Grounded Large Language Model
    Conversational Agents'
  authors:
  - Jiliang Hu
  - Wenfu Wang
  - Zuchao Li
  - Chenxing Li
  - Yiyang Zhao
  - Hanzhao Li
  - Liqiang Zhang
  - Meng Yu
  - Dong Yu
  abstract: 'Recent advances in large audio language models (LALMs) have greatly enhanced
    multimodal conversational systems. However, existing benchmarks remain limited
    -- they are mainly English-centric, rely on synthetic speech, and lack comprehensive,
    discriminative evaluation across multiple dimensions. To address these gaps, we
    present Voice Chat Bot Bench (VCB Bench) -- a high-quality Chinese benchmark built
    entirely on real human speech. VCB Bench evaluates LALMs from three complementary
    perspectives: instruction following (including speech-level control beyond text
    commands), knowledge understanding (general knowledge, reasoning, and daily dialogue),
    and robustness (stability under perturbations in content, environment, and speaker
    traits). Experiments on representative LALMs reveal notable performance gaps and
    highlight future directions for improvement. VCB Bench provides a reproducible
    and fine-grained evaluation framework, offering standardized methodology and practical
    insights for advancing Chinese voice conversational models.'
