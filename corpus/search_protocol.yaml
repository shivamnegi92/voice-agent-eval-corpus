  - date: "2026-10-08"
    item: sources.isca_archive
    note: "Backfilled 2019-2023 (Interspeech 2019-2023, SSW 2019/2021/2023; scripts/search_isca_archive.py): 5,403 papers, 108 matches (1 already in corpus, 1 in arXiv pool), 106 new. Three were screened at full text and accepted after Arpit's review on 2026-10-08; the remaining 103 were screened by title and abstract only, with several plausible candidates flagged for future full-text review. Record: search_runs/2026-10-08-backfill/isca_candidates.csv; inclusions/coding: screening/isca_backfill_includes.yaml and screening/coding_drafts/isca_backfill.yaml."
  - date: "2026-10-08"
    item: sources.ieee
    note: "IEEE speech venues (ICASSP, SLT, ASRU, Odyssey) searched via the free Semantic Scholar bulk API (scripts/search_semanticscholar_ieee.py), title/abstract metadata only: 231 candidates, 115 query-matched, 79 new. IEEE Xplore has no free full-text API; the 2 papers with an arXiv mirror were screened at full text and accepted after Arpit's review on 2026-10-08. The other 77 new candidates remain unscreened beyond metadata. Record: search_runs/2026-10-08-ieee/ieee_candidates.csv; inclusions/coding: screening/ieee_backfill_includes.yaml and screening/coding_drafts/ieee_backfill.yaml."
  - date: "2026-10-08"
    item: historical_query_vocabulary
    note: "The 2019-2023 ACL, ISCA and IEEE backfills reused the 2024-2026 regex set (O2-O6, N01-N14) unchanged. Probes show it misses older phrasings such as 'spoken dialog system evaluation', 'task success in spoken dialogue systems', 'user satisfaction' and PARADISE-style titles; no years before 2019 were searched. The pre-2026 subset is therefore under-sampled and supports no temporal trend (stated in both papers' Limitations)."
  - date: "2026-10-09"
    item: historical_query_vocabulary
    note: "Supplementary title/abstract probes E01-E17 over cached 2019-2023 ACL/ISCA sources matched 370 source records (210 not found in earlier corpus/search records). Among the 92 ACL and 118 ISCA not-found records, provisional triage flagged 15+4 possible_eval and 8+12 uncertain, respectively. These leads fall in 2019-2023, the same period as the accepted ACL/ISCA/IEEE backfills, so the date window does not exclude them; they were not screened for inclusion and lie outside the corpus; they demonstrate additional recall but do not establish completeness. IEEE fresh recall remained blocked; cached IEEE records were prefiltered by old terms. Details and candidates: search_runs/2026-10-09-era-vocabulary/."
  - date: "2026-10-09"
    item: stopping_rule
    note: "Second backward/forward snowball round harvested from all 91 current evaluation works. Backward: 519 unique arXiv references (365 in-window by parser; 311 new IDs; 302 with title/abstract metadata); provisional triage: 55 possible_eval, 35 uncertain. Forward: 77/77 seed citation queries succeeded (1,171 citing records, 492 unique arXiv IDs); official arXiv metadata placed 457 within the exact cutoff, 355 already known, 102 new; provisional triage: 26 possible_eval, 6 uncertain. The <5% stopping rule is defined using newly included works, not provisional AI labels; it has not been evaluated or met. All candidates require author decisions; see search_runs/2026-10-09-snowball-round2/requested-91-eval-seeds/."

  - date: "2026-10-09"
    item: evaluation_focused_rank_cutoff
    note: "Exploratory title/abstract screening and provisional full-text review extended ranks 501-1000 (500 records, 53 initially surfaced; 53 PDFs retrieved and read). Provisional full-text triage: 36 possible_eval, 16 possible_other, 1 exclude; not screened for inclusion and outside the corpus. The rank-500 completeness limitation stands, and this does not establish coverage beyond rank 1000. See search_runs/2026-10-09-rank501-1000/."
  - date: "2026-10-09"
    item: sources.isca_archive
    note: "Supersedes the title/abstract-only status of the 103 remaining ISCA 2019-2023 candidates: full text was acquired for 102 (mevawalla20 returned HTTP 404) and screened by AI model instances with a blind second pass on all proposed inclusions plus seeded exclusions . 2 include_eval works accepted after author review (shangguan2021latency, chen2021ftad); 27 include_other recorded but not coded. Record: search_runs/2026-10-08-backfill/fulltext/."

  - date: "2026-10-09"
    item: sources.ieee
    note: "Full text attempted for the 77 remaining IEEE candidates: 40 open copies read, none accepted; 37 have no open copy (36 need library access, 1 invalid PMC response) and remain screened on metadata only. Record: search_runs/2026-10-08-backfill/fulltext/."

  - date: "2026-10-09"
    item: sources.isca_archive
    note: "Interspeech 2026 probed via public indexes only; the ISCA Archive robots.txt disallows /interspeech_2026/ and was not crawled. Crossref, OpenAlex, Semantic Scholar, arXiv API, and arXiv OAI-PMH (cs.CL, cs.SD, eess.AS comment field) gave 574 unique Interspeech-2026 records; protocol regexes matched 42 (all in window), 39 already known, 3 new. Provisional title/abstract triage: 2 exclude (ASR-only), 1 uncertain (citation record only). Not screened for inclusion; outside the corpus. Index coverage is partial, so the Interspeech 2026 gap is narrowed, not closed. DBLP served a bot challenge and was not circumvented. Record: search_runs/2026-10-09-access-gaps/."
  - date: "2026-10-09"
    item: sources.ieee
    note: "Open-copy retry (OpenAlex, Unpaywall, Semantic Scholar DOI/title, arXiv title) for the 37 IEEE candidates without full text found none; 16 lookups were rate-limited on the Semantic Scholar title search. They remain metadata-only. Record: search_runs/2026-10-09-access-gaps/ieee_retry_discovery.json."
