- paper_id: he2026conversationalvoice
  identifier: arXiv:2609.08147
  pdf_filename: conversationalvoice-full-duplex-speech-data.pdf
  category: end_to_end_s2s
  corpus_role: primary
  title: 'ConversationalVoice: Full-Duplex Speech Data from Real Conversations through
    Source-Faithful Reconstruction and Conversation-Grounded Expansion'
  authors:
  - Richard Yucheng He
  - Baodong Cao
  - Chen Xu
  - Yihang Liu
  - Tairan Chen
  abstract: Full-duplex speech models require training data that preserves turn-taking,
    overlap, interruption, and backchannel behavior, yet these signals are entangled
    across speakers in noisy real-world recordings. We present Conversational Voice,
    a pipeline that converts real two-speaker excerpts into three complementary training-data
    artifacts. (1) Separation recovers speaker-specific tracks with stable speaker
    assignments, a canonical transcript, and naturally observed interaction timing.
    (2) Reconstruction generates speech in matched voices from a fixed source transcript,
    reconstructs the source turn order, pauses, and overlaps, and adds word-level
    alignment and delivery instructions. (3) Expansion generates new dialogue constrained
    by the source context, speakers, and observed interaction pattern. Automatic speaker-verification
    metrics remain strong across stages, with same-speaker similarity of 0.983-0.991
    and positive discrimination margins of 0.199-0.209. Predicted speech quality (NISQA
    MOS) is 3.56 for separation, 4.41 for reconstruction, and 4.61 for expansion.
    A Gemini-based automatic evaluator assigns expansion mean scores of 4.94/5 for
    contextual coherence and 4.80/5 for dialogue naturalness. Expansion and reconstruction
    exhibit broadly similar interaction profiles; expansion's turn, overlap-event,
    backchannel, and interruption rates are 4.6%, 8.0%, 13.2%, and 16.0% lower, respectively.
    We evaluate data properties only; downstream gains in full-duplex model training
    remain for future work.
