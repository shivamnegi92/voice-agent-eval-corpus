  title: 'A Survey of Full-Duplex Spoken Dialogue Systems: Architectural Hierarchy,
    Interaction Ontology, and Decision State Machine'
  authors:
  - Jingyu Lu
  - Yuhan Wang
  - Jianming Luo
  - Yifu Chen
