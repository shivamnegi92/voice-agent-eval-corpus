- paper_id: french2026fdb
  identifier: arXiv:2609.10765
  pdf_filename: french-full-duplex-benchmark.pdf
  category: conversational_benchmarks
  corpus_role: primary
  title: 'From Metrics to Natural Dialogue: French Full-Duplex Benchmark for Spoken
    Dialogue Models'
  authors:
  - Hamid Soltani
  - Gilles Boulianne
  abstract: Full-duplex spoken dialogue models aim to make voice agents more natural
    by allowing them to listen, speak, pause, and respond during ongoing conversation.
    However, it is not clear whether full-duplex benchmarks behave the same way when
    models are evaluated in a different language. To investigate this, we introduce
    a French full-duplex benchmark (FDB) with two variants, CALLFC-FDB for Canadian
    French and MEDIA-FDB for European French, and compare them with an English FDB.
    Built from real spoken resources, these benchmarks evaluate key full-duplex skills,
    including pause handling, turn-taking, backchannels, and interruptions. Beyond
    introducing French FDBs, we evaluate human--human conversations with FDB metrics
    to better understand the values these metrics take in real-world dialogue. Our
    analysis reveals that most timing-based metrics behave similarly across languages,
    while content-based evaluation degrades under language mismatch. We also find
    a trade-off between optimizing benchmark metrics and preserving conversational
    naturalness.
