# Systematic search protocol for the corpus (voice-agent evaluation survey).
# Fixed before screening. Edit only by adding a dated amendment below, never
# by changing an existing query; scripts/search_arxiv.py logs every run.

version: 1
fixed_on: "2026-10-05"
window: {from: "2024-01-01", to: "2026-10-02"}   # submission dates; to = paper cutoff
sources:
  - id: arxiv
    endpoint: "https://export.arxiv.org/api/query"
    categories: [cs.CL, cs.SD, eess.AS, cs.AI, cs.HC, cs.LG]
  - id: acl_anthology    # planned: bibliography export, keyword filter on title/abstract
  - id: isca_archive     # planned: Interspeech and SSW proceedings
  - id: snowball         # planned: backward/forward citations of every included evaluation work

# Queries use arXiv API syntax. O1-O8 are the eight API queries listed in the
# paper's appendix, kept verbatim; N01-N14 extend coverage to the paper's capability axes.
queries:
  O1: 'ti:"Voice Activity Projection"'
  O2: 'abs:"voice agent" AND abs:"benchmark"'
  O3: 'abs:"full-duplex" AND abs:"spoken dialogue"'
  O4: 'abs:"speech-to-speech" AND abs:"end-to-end"'
  O5: 'abs:"neural audio codec" AND abs:"speech"'
  O6: 'abs:"barge-in" OR abs:"interruption handling"'
  O7: 'abs:"streaming" AND abs:"text-to-speech" AND abs:"latency"'
  O8: 'all:"Full-Duplex-Bench"'
  N01: 'abs:"full-duplex" AND (abs:speech OR abs:spoken OR abs:dialogue OR abs:voice)'
  N02: 'abs:"voice agent" OR abs:"voice agents" OR abs:"voice assistant" OR abs:"voice assistants"'
  N03: 'abs:"spoken dialogue" AND (abs:benchmark OR abs:evaluation)'
  N04: 'abs:"turn-taking" AND (abs:speech OR abs:spoken OR abs:dialogue OR abs:conversation)'
  N05: 'abs:"end-of-turn" OR abs:endpointing OR abs:"turn completion"'
  N06: 'abs:interruption AND (abs:spoken OR abs:voice OR abs:"speech model")'
  N07: '(abs:"tool calling" OR abs:"function calling" OR abs:"tool use") AND (abs:speech OR abs:spoken OR abs:voice)'
  N08: 'abs:"speech-to-speech" AND (abs:dialogue OR abs:conversation OR abs:agent)'
  N09: '(abs:"spoken language model" OR abs:"speech language model") AND (abs:dialogue OR abs:conversation OR abs:interactive)'
  N10: '(abs:"multi-party" OR abs:multiparty OR abs:addressee) AND (abs:speech OR abs:spoken OR abs:voice)'
  N11: 'abs:backchannel OR abs:backchannels OR abs:backchanneling'
  N12: '(abs:"audio language model" OR abs:"speech LLM" OR abs:"large audio language model") AND abs:benchmark'
  N13: '(abs:"LLM-as-a-judge" OR abs:"LLM judge" OR abs:"model judge") AND (abs:speech OR abs:spoken OR abs:voice)'
  N14: 'abs:"user simulator" AND (abs:voice OR abs:spoken OR abs:speech)'

inclusion:
  - Primary contribution bears on real-time or interactive spoken interaction - architecture, temporal control, recovery, tool use or task outcomes, multiparty conduct, robustness, or evaluation validity.
  - Training-data and ASR/TTS component studies only where they expose assumptions of interactive or duplex evaluation.
  - Accessible full text in English; preprint and proceedings versions count as one work.
exclusion_reasons:
  E1: out of scope (not interactive spoken interaction)
  E2: component-only speech study with no interactive or evaluation implication
  E3: not a research paper (vendor article, web page, slides, thesis without paper)
  E4: duplicate or superseded version
  E5: full text unavailable
  E6: outside date window
screening:
  stage_1: title and abstract; include if uncertain
  stage_2: full text against inclusion criteria
  second_screener_sample: 0.10
stopping_rule: stop snowballing when a round adds fewer than 5% new included works
recall_check: every retained primary work dated in the window and indexed by arXiv should be retrieved by at least one query; misses are reported and any added query is logged as an amendment

# Amendments are added after the recall check. Report recall before amendment
# (an unbiased estimate) and after (no longer unbiased: queries saw the misses).
amendments:
  - id: A1
    date: "2026-10-05"
    query: '(ti:"audio language models" OR abs:"Audio-LLM" OR abs:"Audio-LLMs") AND (abs:benchmark OR abs:bias)'
    reason: "recall miss yan2026hearbias (abstract says Audio-LLM; plural title not matched by N12)"
  - id: A2
    date: "2026-10-05"
    query: 'abs:"simultaneous speech translation" OR abs:"simultaneous speech-to-speech"'
    reason: "recall miss labiausse2026hibikizero (real-time speech generation outside agent vocabulary)"
  - id: A3
    date: "2026-10-05"
    query: '(abs:Mimi OR abs:Moshi) AND (abs:codec OR abs:tokens OR abs:codebook)'
    reason: "recall miss saloev2026mimi (codec analysis without neural audio codec phrase)"
  - id: A4
    date: "2026-10-05"
    change: "Evaluation-focused search. Pool = logged arXiv queries + backward snowball (arXiv ids in reference lists of the corpus evaluation works, scripts/snowball_refs.py) + forward snowball (Semantic Scholar citations of those works, scripts/snowball_forward.py). Candidates are ordered by a transparent keyword score (scripts/rank_candidates.py) and screened in rank order; the score never includes or excludes a work. Included evaluation and benchmark works are coded; other includes are recorded but not coded. The ranker's recall on the corpus's own evaluation works is reported with the screening depth."
    reason: "time-bounded evaluation-focused search; rank-ordered screening with disclosed depth and calibration recall"
recall_before_amendment: {retrieved: 63, testable: 66, run: "2026-10-05"}

