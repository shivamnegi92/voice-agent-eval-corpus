  title: 'TurnBench: A Multi-Domain Benchmark for Turn-Taking Dynamics in Spoken Dialogue'
  authors:
  - Freeman Jiang
  - Ramon Sanabria
  - Soham Deshmukh
  - Bandhav Veluri
  - Simon Michael Vuch Williams
  - Elliott K. Suen
  - Garreth Lee
  - Kevin Yoonho Choi
  - Takuya Umeki
  - Riku Kubo
  - Sathvik Udupa
  - Chien-yu Huang
  - Shih-Yun Shan Kuan
  - Zhuoyan Tao
  - Satyapriya Krishna
  - Sefik Emre Eskimez
  - Yu Tsao
  - Hung-yi Lee
  - Shinji Watanabe
  abstract: Speakers in natural conversation take turns speaking and listening, deciding
    in real time when to take, hold, or yield the floor. However, turn-taking evaluation
    remains limited due to the lack of a consistent, linguistically grounded evaluation
    protocol and hand-annotated data covering diverse conversation types. To address
    this, we present TurnBench, a multi-domain benchmark that pairs a 30-hour, hand-labeled
    corpus of dyadic human conversation with a standardized evaluation protocol for
    end-of-turn and interruption detection. We set conversation type as a controllable
    experimental variable, covering six distinct interaction styles, and triple-annotate
    each conversation. Benchmarking 14 heterogeneous turn-taking systems, we find
    end-of-turn recall stable across types, while interruption false positives are
    strongly type-dependent and concentrated in backchannel-dense interaction styles.
    Although in smooth floor transfers human listeners begin speaking a median 151
    ms before the current turn ends, no current system performs equivalently without
    incurring excessive false positives. We release our corpus, a 104-hour training
    set, and a public leaderboard with an interactive dataset viewer at https://turnbench.sesame.com.
