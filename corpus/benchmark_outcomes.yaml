  lin2025fdbench: {group: recovery, name: Full-Duplex-Bench, scored: 'Pause handling, backchanneling, turn-taking, and user interruption', evidence: {page: 1, quote: 'evaluates key interactive behaviors: pause handling, backchanneling, turn-taking, and interruption management'}}
  fdbench15: {group: recovery, name: FDB-v1.5, scored: 'Responses to interruption, backchannel, talking to others, and background speech', evidence: {page: 1, quote: 'four representative overlap scenarios: user interruption, user backchannel, talking to others, and background speech'}}
