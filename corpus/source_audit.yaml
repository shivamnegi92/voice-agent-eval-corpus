- paper_id: chen2025mmedfd
  identifier: arXiv:2509.19817
  pdf_filename: mmedfd-healthcare-full-duplex-asr.pdf
  category: conversational_benchmarks
  corpus_role: primary
  title: 'MMedFD: A Real-world Healthcare Benchmark for Multi-turn Full-Duplex Automatic
    Speech Recognition'
  authors:
  - Hongzhao Chen
  - XiaoYang Wang
  - Jing Lan
  - Hexiao Ding
  - Yufeng Jiang
  - MingHui Yang
  - DanHui Xu
  - Jun Luo
  - Nga-Chun Ng
  - Gerald W. Y. Cheng
  - Yunlin Mao
  - Jung Sun Yoo
  abstract: Automatic speech recognition (ASR) in clinical dialogue demands robustness
    to full-duplex interaction, speaker overlap, and low-latency constraints, yet
    open benchmarks remain scarce. We present MMedFD, the first real-world Chinese
    healthcare ASR corpus designed for multi-turn, full-duplex settings. Captured
    from a deployed AI assistant, the dataset comprises 5,805 annotated sessions with
    synchronized user and mixed-channel views, RTTM/CTM timing, and role labels. We
    introduce a model-agnostic pipeline for streaming segmentation, speaker attribution,
    and dialogue memory, and fine-tune Whisper-small on role-concatenated audio for
    long-context recognition. ASR evaluation includes WER, CER, and HC-WER, which
    measures concept-level accuracy across healthcare settings. LLM-generated responses
    are assessed using rubric-based and pairwise protocols. MMedFD establishes a reproducible
    framework for benchmarking streaming ASR and end-to-end duplex agents in healthcare
    deployment. The dataset and related resources are publicly available at https://github.com/Kinetics-JOJO/MMedFD
