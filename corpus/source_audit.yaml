- paper_id: zhao2026echo
  identifier: arXiv:2609.17360
  pdf_filename: paired-turn-taking-dialogue-contexts-echo.pdf
  category: conversational_benchmarks
  corpus_role: primary
  title: 'Same Words, Different Actions: Paired Turn-Taking Evaluation under Rewritten
    Dialogue Contexts'
  authors:
  - Shuofeng Zhao
  - Hongwei Cai
  - Wenke Fan
  - Qingxiang Guo
  - Zhou Wang
  - Dawei Yang
  - Zhiyang Zhou
  - Yingxin Shang
  - Weixu Wang
  - Lin Yang
  - Shuran Zhou
  - Yang Song
  abstract: 'Real-time spoken dialogue systems must distinguish interruptions that
    require yielding the floor from backchannels that permit continued speaking. Existing
    benchmarks typically score events independently and may therefore assign high
    scores to systems with fixed action preferences rather than context-sensitive
    decision policies. We introduce ECHO, a paired diagnostic benchmark for Chinese
    turn-taking evaluation. ECHO pairs examples with the same overlap transcript but
    contrasting preceding multi-turn dialogue contexts, with one requiring Yield and
    the other Keep. It additionally includes off-talk examples for diagnosing unnecessary
    yielding. We introduce pair accuracy, which requires correct decisions on both
    members of a pair and assigns no credit to constant-action policies. Experiments
    on four speech systems show that three exhibit a severe over-yielding bias: they
    correctly keep the floor on fewer than 13% of backchannels, resulting in near-zero
    pairwise success rates equal or less than 4%. While the remaining system remains
    comparatively balanced across contexts, these findings broadly demonstrate that
    interruption-only evaluation can severely overestimate practical turn-taking reliability.'
