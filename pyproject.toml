[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trg-eval"
version = "1.1.0"
description = "TRG (Timing-Recovery-Grounded): a minimum reporting standard and compliance checker for real-time voice agent evaluation"
readme = "README.md"
license = { file = "LICENSE-CODE" }
requires-python = ">=3.9"
dependencies = ["pyyaml>=6.0"]

[project.urls]
Homepage = "https://github.com/shivamnegi92/voice-agent-eval-corpus"
Paper = "https://arxiv.org/abs/2609.30798"

[project.scripts]
trg-validate = "trg_eval.cli:validate_main"
trg-leaderboard = "trg_eval.cli:leaderboard_main"

[tool.setuptools]
packages = ["trg_eval"]
